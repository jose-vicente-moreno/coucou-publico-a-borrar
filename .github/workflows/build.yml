name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a feature branch be built and downloaded without merging it first.
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd NotchBuddy && xcodegen

      - name: Test screen geometry
        run: bash scripts/test-screen-geometry.sh

      - name: Test Claude hook detection
        run: bash scripts/test-claude-hooks.sh

      - name: Test display choice
        run: bash scripts/test-display-choice.sh

      - name: Test parallel Claude Code sessions
        run: bash scripts/test-session-registry.sh

      - name: Test approval queue
        run: bash scripts/test-approval-queue.sh

      - name: Test Flow dictation keys
        run: bash scripts/test-flow-keys.sh

      - name: Test Flow text (snippets, dictionary, numbers)
        run: bash scripts/test-flow-text.sh

      - name: Test Notetaker transcript (speakers, echo, summary, Markdown)
        run: bash scripts/test-notetaker.sh

      - name: Desktop Mochi and gaze tests
        run: bash scripts/test-desktop-mochi.sh

      - name: Test auto-close timing
        run: bash scripts/test-auto-close.sh

      - name: Test open on hover
        run: bash scripts/test-island-hover.sh

      - name: Wake phrase tests
        run: bash scripts/test-voice-wake.sh

      - name: Energy VAD tests
        run: bash scripts/test-voice-vad.sh

      - name: Voice island FSM tests
        run: bash scripts/test-voice-island.sh

      - name: Voice IntentParser tests
        run: bash scripts/test-voice-intent.sh

      - name: Voice EntityResolver tests
        run: bash scripts/test-voice-entity.sh

      - name: Voice ActionRunner tests
        run: bash scripts/test-voice-runner.sh


      - name: Voice query tests

        run: bash scripts/test-voice-query.sh

      - name: Voice conversation end-phrase tests
        run: bash scripts/test-voice-conversation.sh

      - name: Voice gender tests
        run: bash scripts/test-voice-gender.sh

      - name: Test terminal target
        run: bash scripts/test-terminal-target.sh

      - name: Test link filter
        run: bash scripts/test-safe-links.sh

      - name: Test Claude response text
        run: bash scripts/test-claude-response.sh

      - name: Test chat parsing
        run: bash scripts/test-chat-parsing.sh

      - name: Test Claude Code provider
        run: bash scripts/test-claude-code.sh

      - name: Test Coucou MCP relay
        run: bash scripts/test-coucou-mcp.sh

      - name: Test brain config
        run: bash scripts/test-brain-config.sh

      - name: Test brain inbox
        run: bash scripts/test-brain-inbox.sh

      - name: Test brain status
        run: bash scripts/test-brain-status.sh

      - name: Test VoiceStudio
        run: bash scripts/test-voicestudio.sh

      - name: Test agent sessions
        run: bash scripts/test-agent-sessions.sh

      - name: Test terminal focus (quiet when the terminal is in front)
        run: bash scripts/test-terminal-focus.sh

      # These three existed in the tree and no workflow ever ran them, so they
      # were proving nothing. test-claude-host covers the terminal identification
      # that the focus test above depends on.
      - name: Test Claude host identification
        run: bash scripts/test-claude-host.sh

      # The nb-hook scripts are Swift string literals, so Swift never checks them.
      # Without this the app builds green while every hook dies on a SyntaxError.
      - name: Test the embedded nb-hook scripts compile
        run: bash scripts/test-hook-script.sh

      - name: Test the text shown when an agent fails
        run: bash scripts/test-stop-failure-text.sh

      - name: Test the plan card's title
        run: bash scripts/test-plan-title.sh

      - name: Test shortcuts
        run: bash scripts/test-shortcuts.sh

      - name: Test voice backoff
        run: bash scripts/test-voice-backoff.sh

      - name: Test plan gauge
        run: bash scripts/test-plan-gauge.sh

      - name: Test ask question
        run: bash scripts/test-ask-question.sh

      - name: Diff engine tests
        run: bash scripts/test-diff-engine.sh

      - name: GitHub pulse tests
        run: bash scripts/test-github-pulse.sh

      - name: GitHub activity tests
        run: bash scripts/test-github-activity.sh

      - name: Wardrobe tests
        run: bash scripts/test-wardrobe.sh

      - name: Pill colour tests
        run: bash scripts/test-pill-colors.sh

      - name: Claude settings file tests
        run: bash scripts/test-claude-settings.sh

      - name: Turn end policy tests
        run: bash scripts/test-turn-end-policy.sh

      - name: Voice spotter generation tests
        run: bash scripts/test-voice-spotter-gen.sh

      - name: Voice wake blocked tests
        run: bash scripts/test-voice-wake-blocked.sh

      - name: Conversation context tests
        run: bash scripts/test-conversation-context.sh

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme NotchBuddy \
            -configuration Release \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # 65 is a build error; 137 or 139 means the compiler was killed or
            # crashed, and then there is no "error:" line to find.
            echo "::error::xcodebuild exited with $status"
            grep -E "error:" build.log | sort -u | head -30 | sed 's/^/::error::/' || true
            echo "::group::last 60 lines of build.log"
            tail -60 build.log
            echo "::endgroup::"
            echo "::group::runner resources"
            df -h / /Users || true
            vm_stat | head -6 || true
            echo "::endgroup::"
            exit 1
          fi

      # The job log gets truncated well before the end, so the only reliable
      # way to see why a build died is to carry the file out of the runner.
      - name: Keep the build log when the build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
          if-no-files-found: warn

      - name: Build App Store target (unsigned)
        run: |
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme CoucouAppStore \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build iPhone link spike (Mac, DebugCloud, unsigned)
        run: |
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme NotchBuddyCloud \
            -configuration DebugCloud \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build iPhone link spike (Mac, ReleaseCloud, unsigned)
        run: |
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme NotchBuddy \
            -configuration ReleaseCloud \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build iPhone app (unsigned)
        run: |
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme CoucouPhone \
            -destination 'generic/platform=iOS' \
            build \
            CODE_SIGNING_ALLOWED=NO

      # Makes the Release build downloadable from the run, so the app can be
      # tried on a Mac that has no Xcode. It is unsigned, so it needs an ad-hoc
      # signature before it will launch.
      # A separate Release build for downloading and trying locally.
      #
      # It drops PHONE_LINK on purpose. An unsigned build carries no entitlements,
      # so it has no iCloud container, and `CloudProbe.init()` traps inside CloudKit
      # the moment the app finishes launching. The iPhone link cannot work in an
      # unsigned copy anyway, so compiling it out is what makes the download
      # actually start. Everything else, including the notch, the chat and the
      # agent list, is unaffected.
      - name: Build the downloadable app (no iCloud)
        run: |
          set -o pipefail
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme NotchBuddy \
            -configuration Release \
            -derivedDataPath dd-local \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="" 2>&1 | tail -20

      - name: Package the Mac app
        run: |
          set -euo pipefail
          APP=dd-local/Build/Products/Release/Coucou.app
          test -d "$APP"
          ditto -c -k --keepParent "$APP" Coucou-unsigned.zip

      - name: Upload the Mac app
        uses: actions/upload-artifact@v4
        with:
          name: Coucou-unsigned
          path: Coucou-unsigned.zip
          retention-days: 7
